<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #282a36; }
  body {
    font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace;
    color: #f8f8f2;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  a { color: #ff79c6; text-decoration: none; position: relative; transition: color .15s ease; }
  a:hover { color: #f8f8f2; }
  a:not(.pane-label)::after {
    content: "";
    position: absolute;
    left: 0; right: 100%; bottom: -1px;
    height: 1px;
    background: currentColor;
    transition: right .15s ease;
  }
  a:not(.pane-label):hover::after { right: 0; }
  @keyframes blink { 0%, 50% { opacity: 1; } 50.01%, 100% { opacity: 0; } }

  #screen {
    position: relative;
    width: 100vw;
    height: 100vh;
    padding: 4vh 5vw;
    display: grid;
    grid-template-columns: 290px 1fr;
    grid-template-rows: 46px 1fr 56px;
    gap: 14px;
  }
  #screen::before {
    content: "";
    position: absolute;
    inset: 0;
    opacity: .14;
    pointer-events: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='200' height='200' filter='url(%23n)'/></svg>");
  }

  .pane {
    position: relative;
    border: 1px solid #6272a4;
    padding: 22px 16px 14px;
    transition: border-color .2s ease, box-shadow .2s ease;
  }
  .pane:hover {
    border-color: #bd93f9;
    box-shadow: 0 0 0 1px rgba(189,147,249,.15), 0 4px 20px rgba(189,147,249,.08);
  }
  .pane-label {
    position: absolute;
    top: -9px;
    left: 12px;
    background: #282a36;
    padding: 0 6px;
    color: #bd93f9;
    transition: color .2s ease;
  }
  .pane:hover .pane-label { color: #ff79c6; }

  /* search bar */
  #search {
    position: relative;
    grid-column: 1 / 3;
    border: 1px solid #6272a4;
    padding: 0 16px;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: border-color .2s ease, box-shadow .2s ease;
  }
  #search:focus-within {
    border-color: #bd93f9;
    box-shadow: 0 0 0 1px rgba(189,147,249,.15), 0 4px 20px rgba(189,147,249,.08);
  }
  #search:focus-within .pane-label { color: #ff79c6; }
  #search-box {
    position: relative;
    flex: 1;
    display: flex;
    align-items: center;
    height: 24px;
  }
  #search-input {
    position: absolute;
    inset: 0;
    width: 100%;
    background: transparent;
    border: 0;
    outline: 0;
    color: transparent;
    caret-color: transparent;
    font: inherit;
    padding: 0;
  }
  #search-echo { pointer-events: none; color: #fff; white-space: pre; }
  #cursor { pointer-events: none; display: inline-block; width: 8px; height: 16px; background: #bd93f9; animation: blink 1.06s steps(1) infinite; }
  #search-hint { pointer-events: none; margin-left: 10px; color: #6272a4; }

  /* home pane */
  #home-pane { display: flex; flex-direction: column; gap: 10px; }
  #greeting { font-size: 16px; font-weight: 700; color: #fff; }
  #clock { font-size: 30px; font-weight: 700; line-height: 1; color: #bd93f9; }
  #date { color: #fff; }
  .wx { border-top: 1px dashed #6272a4; padding-top: 10px; display: flex; flex-direction: column; gap: 2px; }
  .wx-row { display: flex; justify-content: space-between; }
  .wx-row span:first-child { color: #6272a4; }
  .wx-row span:last-child { color: #8be9fd; }
  .wx-row.sun span:last-child { color: #f1fa8c; }

  /* links pane */
  #links-pane { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 20px; align-content: start; }
  .group-name { color: #8be9fd; margin-bottom: 2px; }
  .group-name::before { content: "## "; }
  #links-pane a { display: inline-block; transition: color .15s ease, transform .15s ease; }
  #links-pane a:hover { transform: translateX(2px); }
  #cat {
    position: absolute;
    right: 16px;
    bottom: 10px;
    margin: 0;
    font: inherit;
    line-height: 1.2;
    color: #bd93f9;
    opacity: .55;
    transition: opacity .2s ease, transform .3s ease;
    cursor: default;
  }
  #cat:hover { opacity: .9; transform: translateY(-2px) rotate(-2deg); }

  /* fortune */
  #fortune {
    position: relative;
    grid-column: 1 / 3;
    border: 1px solid #6272a4;
    padding: 8px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    transition: border-color .2s ease, box-shadow .2s ease;
  }
  #fortune:hover {
    border-color: #bd93f9;
    box-shadow: 0 0 0 1px rgba(189,147,249,.15), 0 4px 20px rgba(189,147,249,.08);
  }
  #fortune:hover .pane-label { color: #ff79c6; }
  #quote {
    font-style: italic;
    font-size: 12px;
    display: inline-block;
    transition: opacity .15s ease;
  }
  #quote.swapping { opacity: 0; }
  #author { color: #50fa7b; transition: opacity .15s ease; }
  #author.swapping { opacity: 0; }
  #new-quote {
    flex: none;
    color: #6272a4;
    cursor: pointer;
    display: inline-block;
    transition: color .15s ease, transform .15s ease;
  }
  #new-quote:hover { color: #50fa7b; transform: scale(1.08); }
  #new-quote:active { transform: scale(.95); }
</style>
</head>
<body>
<div id="screen">
  <div id="search">
    <span class="pane-label">search</span>
    <span style="color:#50fa7b">&#10095;</span>
    <div id="search-box">
      <input id="search-input" spellcheck="false" autofocus>
      <span id="search-echo"></span><span id="cursor"></span>
      <span id="search-hint">type to search &middot; y = youtube &middot; gh = github</span>
    </div>
    <span style="color:#6272a4">[/]</span>
  </div>

  <div class="pane" id="home-pane">
    <span class="pane-label">~/home</span>
    <div id="greeting"></div>
    <div id="clock"></div>
    <div id="date"></div>
    <div class="wx">
      <div class="wx-row"><span>place</span><span id="wx-place">...</span></div>
      <div class="wx-row"><span>temp</span><span id="wx-temp">--</span></div>
      <div class="wx-row"><span>rain</span><span id="wx-rain">--%</span></div>
      <div class="wx-row sun"><span>sunrise</span><span id="wx-sunrise">--:--</span></div>
      <div class="wx-row sun"><span>sunset</span><span id="wx-sunset">--:--</span></div>
    </div>
  </div>

  <div class="pane" id="links-pane"></div>

  <div id="fortune">
    <span class="pane-label">fortune</span>
    <span>"<span id="quote">Loading a quote...</span>" <span id="author"></span></span>
    <a id="new-quote" href="#">[n] new</a>
  </div>
</div>

<pre id="cat"> /\_/\
( o.o )
 &gt; ^ &lt;</pre>

<script src="app.js" defer></script>
</body>
</html>

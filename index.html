<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#282a36">
<title>home</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='3' fill='%23282a36'/><text x='3' y='13' font-size='13' font-family='monospace' fill='%23bd93f9'>&gt;</text></svg>">
<link rel="stylesheet" href="base.css">
<script src="theme.js"></script>
<style>
  #screen {
    position: relative;
    width: 100%;
    min-height: 100dvh;
    padding: 4vh 5vw;
    display: grid;
    grid-template-columns: 290px 1fr;
    grid-template-rows: 46px 1fr minmax(56px, auto);
    gap: 14px;
  }
  .pane { position: relative; padding: 22px 16px 14px; }
  .pane-label {
    position: absolute;
    top: -9px;
    left: 12px;
    background: var(--bg);
    padding: 0 6px;
    color: var(--accent);
    transition: color .2s ease;
  }
  .pane:hover .pane-label, #search:focus-within .pane-label, #fortune:hover .pane-label { color: var(--pink); }

  #search { grid-column: 1 / 3; }

  /* home pane */
  #home-pane { display: flex; flex-direction: column; gap: 10px; }
  #greeting { font-size: 16px; font-weight: 700; color: var(--strong); }
  #clock { align-self: flex-start; background: none; border: 0; padding: 0; font: inherit; color: var(--accent); cursor: pointer; }
  #time { font-size: 30px; font-weight: 700; line-height: 1; }
  #ampm { font-size: 14px; }
  #date { color: var(--strong); }
  .wx { border-top: 1px dashed var(--border); padding-top: 10px; display: flex; flex-direction: column; gap: 2px; }
  .wx-row { display: flex; justify-content: space-between; gap: 8px; }
  .wx-row span:first-child { color: var(--muted); }
  .wx-row span:last-child { color: var(--cyan); text-align: right; }
  .wx-row.sun span:last-child { color: var(--yellow); }
  #wx-days { border-top: 1px dashed var(--border); padding-top: 8px; margin-top: 6px; display: flex; flex-direction: column; gap: 2px; }

  /* links pane */
  #links-pane { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 20px; align-content: start; }
  .group-name { color: var(--cyan); margin-bottom: 2px; }
  .group-name::before { content: "## "; }
  #links-pane a { display: inline-block; }
  #links-pane a:hover { transform: translateX(2px); }
  #cat { position: absolute; right: 16px; bottom: 10px; }

  /* fortune */
  #fortune {
    position: relative;
    grid-column: 1 / 3;
    padding: 8px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }
  #quote { font-style: italic; font-size: 12px; display: inline-block; transition: opacity .15s ease; }
  #author { color: var(--green); transition: opacity .15s ease; }
  #quote.swapping, #author.swapping { opacity: 0; }
  #new-quote { flex: none; background: none; border: 0; padding: 0; font: inherit; color: var(--muted); cursor: pointer; }
  #new-quote:hover { color: var(--green); transform: scale(1.08); }
  #new-quote:active { transform: scale(.95); }

  @media (max-width: 900px) {
    #screen { grid-template-columns: 1fr; grid-template-rows: auto; padding: 24px 16px; }
    #search, #fortune { grid-column: 1; }
    #search { height: 46px; }
    #cat { position: static; grid-column: 1 / -1; justify-self: end; }
  }
</style>
</head>
<body>
<noscript><p class="noscript">enable JavaScript to use this page</p></noscript>
<div id="screen">
  <div id="search">
    <span class="pane-label">search</span>
    <span class="prompt">&#10095;</span>
    <input id="search-input" aria-label="Search" spellcheck="false" autocomplete="off" autofocus>
    <span class="muted">[/]</span>
  </div>

  <div class="pane" id="home-pane">
    <span class="pane-label">~/home</span>
    <div id="greeting"></div>
    <button id="clock" type="button" title="click to toggle 12/24h"><span id="time"></span><span id="ampm"></span></button>
    <div id="date"></div>
    <div class="wx">
      <div class="wx-row"><span>place</span><span id="wx-place">...</span></div>
      <div class="wx-row"><span>now</span><span id="wx-now">...</span></div>
      <div class="wx-row"><span>temp</span><span id="wx-temp">--</span></div>
      <div class="wx-row"><span>hi / lo</span><span id="wx-range">--</span></div>
      <div class="wx-row"><span>wind</span><span id="wx-wind">--</span></div>
      <div class="wx-row"><span>rain</span><span id="wx-rain">--%</span></div>
      <div class="wx-row sun"><span>sunrise</span><span id="wx-sunrise">--:--</span></div>
      <div class="wx-row sun"><span>sunset</span><span id="wx-sunset">--:--</span></div>
    </div>
    <div class="wx" id="wx-days"></div>
  </div>

  <div class="pane" id="links-pane">
    <pre id="cat" aria-hidden="true"> /\_/\
( o.o )
 &gt; ^ &lt;</pre>
  </div>

  <div id="fortune">
    <span class="pane-label">fortune</span>
    <span>"<span id="quote"></span>" <span id="author"></span></span>
    <button id="new-quote" type="button">[n] new</button>
  </div>
</div>

<script src="quotes.js" defer></script>
<script src="search.js" defer></script>
<script src="app.js" defer></script>
</body>
</html>
